<?xml version="1.0" encoding="UTF-8"?>
<!--
  Family Clock — Faceplate template

  Inner opening: 254 × 102 mm  (10" × 4")
  Material:      3 mm MDF, baltic birch, or acrylic
                 (DO NOT use 1/4" / 6 mm — quartz-movement threaded shafts
                  are only ~5 mm long and the mounting nut won't reach.)
  Cut color:     red (#ff0000), 0.1 mm stroke
  Etch color:    none in this version (decorations are optional)

  Cut elements:
    1× outer perimeter rectangle              254 × 102 mm
    3× clock-movement shaft holes             8 mm diameter
    3× OLED active-area windows               23 × 12 mm

  All coordinates in mm, origin top-left.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="254mm" height="102mm"
     viewBox="0 0 254 102">
  <title>Family Clock — Faceplate</title>

  <g fill="none" stroke="#ff0000" stroke-width="0.1">

    <!-- Outer perimeter -->
    <rect x="0" y="0" width="254" height="102"/>

    <!-- Clock-movement shaft holes (8 mm diameter) -->
    <!-- Column centers at x = L/6, L/2, 5L/6 → 42.3, 127, 211.7 mm -->
    <!-- Row at y = 30 mm from top (upper half of plate) -->
    <circle cx="42.3"  cy="30" r="4"/>
    <circle cx="127"   cy="30" r="4"/>
    <circle cx="211.7" cy="30" r="4"/>

    <!-- OLED active-area windows (23 × 12 mm, +1 mm tolerance over the
         SSD1306 active rectangle of 21.74 × 10.86 mm) -->
    <!-- Centered horizontally under each clock; centered vertically at y = 80 -->
    <rect x="30.8"  y="74" width="23" height="12"/>
    <rect x="115.5" y="74" width="23" height="12"/>
    <rect x="200.2" y="74" width="23" height="12"/>

  </g>
</svg>
